# docker-compose.yml — Mail Tracker
#
# All four services — traefik, frontend, backend, mysql — in one file, one
# VM, same shape as illumiasolutions.com's own docker-compose.yml. Traefik
# terminates TLS and routes by hostname; frontend/backend publish no ports of
# their own, only Traefik's 80/443 are exposed to the host. See
# TRAEFIK_SETUP.md for the full first-run walkthrough (network + cert setup).
#
# Bundled database: the `mysql` service below is a local MariaDB container
# for convenience — delete it and point backend/.env's DATABASE_URL at an
# external managed MySQL host instead if you'd rather.
#
# Hostnames below (tracker.illumiasolutions.com / trackerapi.illumiasolutions.com
# / traefik.illumiasolutions.com) are placeholders — swap for whatever DNS
# actually points at this VM.
#
# Usage:
#   docker network create ispl-website   # once, before first `up`
#   docker compose up -d --build         # build & start
#   docker compose down                  # stop & remove (keeps the mysql_data volume)
#   docker compose logs -f               # tail logs

services:

  traefik:
    image: traefik:v3.7
    container_name: mail-tracker-traefik
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ispl-website"
      - "--providers.file.filename=/dynamic/tls.yaml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.illumiasolutions.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      - ispl-website

  mysql:
    image: mariadb:10.11.13
    container_name: mail-tracker-mysql
    env_file:
      - ./backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - ispl-website
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mail-tracker-backend
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ispl-website
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailtracker-backend.rule=Host(`trackerapi.illumiasolutions.com`)"
      - "traefik.http.routers.mailtracker-backend.entrypoints=websecure"
      - "traefik.http.routers.mailtracker-backend.tls=true"
      - "traefik.http.services.mailtracker-backend.loadbalancer.server.port=4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mail-tracker-frontend
    # frontend/.env's NEXT_PUBLIC_API_URL must be http://backend:4000 (the
    # compose service name) here, not the public trackerapi hostname —
    # next.config.ts's rewrites() and lib/backend.ts run inside this
    # container and reach the backend directly over ispl-website, no need
    # to round-trip through Traefik.
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ispl-website
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailtracker-frontend.rule=Host(`tracker.illumiasolutions.com`)"
      - "traefik.http.routers.mailtracker-frontend.entrypoints=websecure"
      - "traefik.http.routers.mailtracker-frontend.tls=true"
      - "traefik.http.services.mailtracker-frontend.loadbalancer.server.port=3000"

volumes:
  mysql_data:

networks:
  ispl-website:
    external: true
