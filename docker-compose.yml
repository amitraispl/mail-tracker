  #    - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
  #    - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
  #    - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
  #    - "--entrypoints.websecure.address=:443"
  #    - "--entrypoints.websecure.http.tls=true"
  #  labels:
  #    - "traefik.enable=true"
  #    - "traefik.http.routers.dashboard.rule=Host(`traefik.illumiasolutions.com`)"
  #   - "traefik.http.routers.dashboard.entrypoints=websecure"
  #    - "traefik.http.routers.dashboard.service=api@internal"
  #    - "traefik.http.routers.dashboard.tls=true"
  #  restart: unless-stopped
  #  ports:
  #    - "80:80"
  #    - "443:443"
  #  volumes:
  #    - /var/run/docker.sock:/var/run/docker.sock:ro
  #    - ./traefik/dynamic:/dynamic:ro
  #    - ./traefik/certs:/certs:ro
  #  networks:
  #    - ispl-website

  mail-tracker-mysql:
    image: mariadb:10.11.13
    container_name: mail-tracker-mysql
    env_file:
      - ./backend/.env
    volumes:
      - mail-tracker-mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - ispl-website
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  mail-tracker-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mail-tracker-backend
    env_file:
      - ./backend/.env
    depends_on:
      mail-tracker-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ispl-website
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailtracker-backend.rule=Host(`mailtrackerapi.illumiasolutions.com`)"
      - "traefik.http.routers.mailtracker-backend.entrypoints=websecure"
      - "traefik.http.routers.mailtracker-backend.tls=true"

  mail-tracker-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Must be http://backend:4000 (the compose service name), not the
      # public trackerapi hostname — next.config.ts's rewrites() bakes this
      # in at build time (see the comment in frontend/Dockerfile), so it has
      # to be a build arg, not just a runtime env var. frontend/.env carries
      # the same value too, for lib/backend.ts's runtime reads.
      args:
        NEXT_PUBLIC_API_URL: http://backend:4000
    container_name: mail-tracker-frontend
    env_file:
      - ./frontend/.env
    extra_hosts:
      - "mailtrackerapi.illumiasolutions.com:172.18.0.14"
    depends_on:
      mail-tracker-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ispl-website
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailtracker-frontend.rule=Host(`mailtracker.illumiasolutions.com`)"
      - "traefik.http.routers.mailtracker-frontend.entrypoints=websecure"
      - "traefik.http.routers.mailtracker-frontend.tls=true"

volumes:
  mail-tracker-mysql-data:

networks:
  ispl-website:
    external: true
