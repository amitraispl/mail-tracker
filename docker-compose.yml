# docker-compose.yml — Mail Tracker
#
# Self-host alternative to the Vercel(frontend) + persistent-host(backend) setup
# described in README.md. Both app services still deploy independently in
# prod — this just lets you run the whole stack, including its own database,
# on one box.
#
# Bundled database: the `mysql` service below is a local MariaDB container
# for self-hosting convenience. This app also works fine against an external
# managed MySQL (Aiven, RDS, etc.) instead — if you go that route, delete the
# `mysql` service below and the four MARIADB_* vars from backend/.env.example,
# and just point backend/.env's DATABASE_URL at your managed host directly
# (see the comment above DATABASE_URL in backend/.env.example).
#
# Usage:
#   docker compose up -d          # build & start
#   docker compose up -d --build  # rebuild after code changes
#   docker compose down           # stop & remove (keeps the mysql_data volume)
#   docker compose down -v        # also delete the mysql_data volume  ← DESTRUCTIVE
#   docker compose logs -f        # tail logs

services:

  # ── Database ──────────────────────────────────────────────────────────────
  # Reachable only from backend, via db-net. frontend has no route to it.
  mysql:
    image: mariadb:10.11.13
    container_name: mail-tracker-mysql
    env_file:
      - ./backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db-net
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, DAC_OVERRIDE]   # required for mysql data dir ownership
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    healthcheck:
      # healthcheck.sh is the official MariaDB image's own health script —
      # avoids putting a password on the command line.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    labels:
      com.mailtracker.service: "mysql"
      com.mailtracker.role: "database"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mail-tracker-backend:latest
    container_name: mail-tracker-backend
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped
    init: true                         # tini as PID 1 — proper signal forwarding + zombie reaping
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - db-net
      - app-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    labels:
      com.mailtracker.service: "backend"
      com.mailtracker.role: "api"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mail-tracker-frontend:latest
    container_name: mail-tracker-frontend
    # frontend/.env's NEXT_PUBLIC_API_URL must be http://backend:4000 (the
    # compose service name) here, not localhost:4000 — next.config.ts's
    # rewrites() and lib/backend.ts run inside this container and need the
    # in-network address to reach the backend service.
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.10"
          memory: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      com.mailtracker.service: "frontend"
      com.mailtracker.role: "web"

networks:
  db-net:
    driver: bridge
    internal: true      # no outbound internet from this network — DB is fully isolated
  app-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
